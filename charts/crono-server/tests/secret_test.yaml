suite: crono-server credentials Secret
release:
  name: crono-server
  namespace: crono
templates:
  - secret.yaml
  - deployment.yaml
values:
  - required_values.yaml
tests:
  - it: creates the Secret from secret.* when existingSecret is empty
    template: secret.yaml
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: crono-server
      - equal:
          path: data.CRONO_AUTH_DEVELOPMENT_TOKEN
          value: dGVzdC1vbmx5LWR1bW15LXRva2VuLW5vdC1hLXJlYWwtc2VjcmV0LTAwMDA=
      - equal:
          path: data.PGPASSWORD
          value: dGVzdC1vbmx5LWR1bW15LXBhc3N3b3Jk
      - notExists:
          path: data["nats.nkey"]

  - it: wires the chart-created Secret into the Deployment with a checksum
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name == "CRONO_AUTH_DEVELOPMENT_TOKEN")].valueFrom.secretKeyRef
          value:
            name: crono-server
            key: CRONO_AUTH_DEVELOPMENT_TOKEN
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name == "PGPASSWORD")].valueFrom.secretKeyRef
          value:
            name: crono-server
            key: PGPASSWORD
      - equal:
          path: spec.template.metadata.annotations["checksum/secret"]
          value: 581aef20206c623445d9f2c42776e913a4bff37bda975738f43093991a8c5be7

  - it: changes the checksum when a secret value changes
    template: deployment.yaml
    set:
      secret.databasePassword: another-test-only-password
    asserts:
      - equal:
          path: spec.template.metadata.annotations["checksum/secret"]
          value: 75df1693931add9203f176fcff9887c90731b333824017434d62358b5b5446e9

  - it: uses an existing Secret without creating one or a checksum
    set:
      existingSecret: crono-credentials
      secret.authToken: null
      secret.databasePassword: null
    asserts:
      - hasDocuments:
          count: 0
        template: secret.yaml
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name == "PGPASSWORD")].valueFrom.secretKeyRef.name
          value: crono-credentials
        template: deployment.yaml
      - notExists:
          path: spec.template.metadata.annotations["checksum/secret"]
        template: deployment.yaml

  - it: keeps user pod annotations next to the checksum
    template: deployment.yaml
    set:
      podAnnotations:
        example.com/team: platform
    asserts:
      - equal:
          path: spec.template.metadata.annotations["example.com/team"]
          value: platform
      - exists:
          path: spec.template.metadata.annotations["checksum/secret"]

  - it: fails without authToken
    template: secret.yaml
    set:
      secret.authToken: null
    asserts:
      - failedTemplate:
          errorPattern: secret.authToken is required when existingSecret is empty

  - it: fails with an authToken shorter than 32 bytes
    template: secret.yaml
    set:
      secret.authToken: too-short
    asserts:
      - failedTemplate:
          errorPattern: secret.authToken must be 32-8192 bytes

  - it: fails without databasePassword
    template: secret.yaml
    set:
      secret.databasePassword: ""
    asserts:
      - failedTemplate:
          errorPattern: secret.databasePassword is required when existingSecret is empty

  - it: fails in nkey mode without natsNkeySeed
    template: secret.yaml
    set:
      nats.auth.mode: nkey
    asserts:
      - failedTemplate:
          errorPattern: secret.natsNkeySeed is required when nats.auth.mode is nkey

  - it: fails in creds mode without natsCreds
    template: secret.yaml
    set:
      nats.auth.mode: creds
    asserts:
      - failedTemplate:
          errorPattern: secret.natsCreds is required when nats.auth.mode is creds

  - it: fails in userPassword mode without natsPassword
    template: secret.yaml
    set:
      nats.auth.mode: userPassword
      nats.auth.user: crono
    asserts:
      - failedTemplate:
          errorPattern: secret.natsPassword is required when nats.auth.mode is userPassword

  - it: stores the NATS credential required by the auth mode
    template: secret.yaml
    set:
      nats.auth.mode: creds
      secret.natsCreds: test-only-creds
    asserts:
      - equal:
          path: data["nats.creds"]
          value: dGVzdC1vbmx5LWNyZWRz
