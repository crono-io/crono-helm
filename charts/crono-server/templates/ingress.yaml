{{- /*
Routes `ingress.path` (default `/api`) on `ingress.host` to crono-server.
crono-web serves `/` on the same host from its own Ingress. Operational paths
(/live, /ready, /health, /metrics) live at the root of the server, so they are
never routed.
*/ -}}
{{- if .Values.ingress.enabled }}
{{- $host := required "crono-server: ingress.host is required when ingress.enabled" .Values.ingress.host }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "crono-server.fullname" . | quote }}
  labels:
    {{- include "crono-server.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ $host | quote }}
      secretName: {{ required "crono-server: ingress.tls.secretName is required when ingress.tls.enabled" .Values.ingress.tls.secretName | quote }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.path | quote }}
            pathType: {{ .Values.ingress.pathType | quote }}
            backend:
              service:
                name: {{ include "crono-server.fullname" . | quote }}
                port:
                  name: http
{{- end }}
