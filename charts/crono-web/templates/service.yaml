{{- /* Service for crono-web; expose it through the Ingress, not directly. */ -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "crono-web.fullname" . | quote }}
  labels:
    {{- include "crono-web.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type | quote }}
  selector:
    {{- include "crono-web.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      appProtocol: http
