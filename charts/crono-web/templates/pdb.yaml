{{- /*
Keeps at least `podDisruptionBudget.minAvailable` pods through voluntary
disruptions (node drains and upgrades). Rendered only with more than one
effective replica (`autoscaling.minReplicas` when autoscaling, else
`replicaCount`): with a single pod it would block every drain.
*/ -}}
{{- $replicas := ternary .Values.autoscaling.minReplicas .Values.replicaCount .Values.autoscaling.enabled }}
{{- if and .Values.podDisruptionBudget.enabled (gt (int $replicas) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "crono-web.fullname" . | quote }}
  labels:
    {{- include "crono-web.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      {{- include "crono-web.selectorLabels" . | nindent 6 }}
{{- end }}
