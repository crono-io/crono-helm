{{- /*
Chart-created credentials, rendered only when `existingSecret` is empty. The
Deployment carries a checksum of this data so a changed value rolls the pods.
*/ -}}
{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "crono-server.fullname" . | quote }}
  labels:
    {{- include "crono-server.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key, $value := include "crono-server.secretData" . | fromYaml }}
  {{ $key }}: {{ $value | toString | b64enc | quote }}
  {{- end }}
{{- end }}
