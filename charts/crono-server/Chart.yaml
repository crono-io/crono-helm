apiVersion: v2
name: crono-server
description: >-
  crono-server: the crono control plane (HTTP API, scheduler, outbox dispatcher and worker-control responders). PostgreSQL, NATS JetStream and execution workers are external to this chart.
type: application
version: 0.2.0
appVersion: "0.1.9"
# preStop `sleep` lifecycle handlers are enabled by default from 1.30.
kubeVersion: ">=1.30.0-0"
home: https://github.com/crono-io/crono
sources:
  - https://github.com/crono-io/crono
  - https://github.com/crono-io/crono-helm
keywords:
  - crono
  - scheduler
  - workflows
maintainers:
  - name: Crono maintainers
    email: nbari@tequila.io
