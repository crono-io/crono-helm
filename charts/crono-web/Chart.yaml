apiVersion: v2
name: crono-web
description: >-
  crono-web: the crono single-page app served by unprivileged nginx. Route `/` to it and `/api` to crono-server on the same host.
type: application
version: 0.2.0
appVersion: "0.1.9"
# preStop `sleep` lifecycle handlers are enabled by default from 1.30.
kubeVersion: ">=1.30.0-0"
home: https://github.com/crono-io/crono
sources:
  - https://github.com/crono-io/crono
  - https://github.com/crono-io/crono-helm
keywords:
  - crono
  - scheduler
  - workflows
maintainers:
  - name: Crono maintainers
    email: nbari@tequila.io
